# Manual, approval-gated release. See RELEASING.md before the first run.
name: Publish
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Workspaces to publish, in dependency order
        default: '@insign/fidelis @insign/fidelis-claude-code @insign/fidelis-opencode'
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: node --version && npm --version
      - run: npm ci
      - run: npm test
      - name: Publish approved workspaces
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          for name in $PACKAGES; do
            case "$name" in
              @insign/fidelis|@insign/fidelis-claude-code|@insign/fidelis-opencode) ;;
              *) echo "Refusing unknown package: $name"; exit 1 ;;
            esac
            version=$(npm pkg get version --workspace "$name" | sed -n 's/.*: "\(.*\)".*/\1/p;s/^"\(.*\)"$/\1/p' | head -n 1)
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm pack --dry-run --workspace "$name"
            npm publish --workspace "$name" --access public
          done
