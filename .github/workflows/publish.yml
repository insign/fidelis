# Release Please keeps a release pull request open on main. Merging it tags the release and publishes to npm.
# Manual dispatch from main publishes whatever is not on npm yet. See RELEASING.md.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Workspaces to publish, in dependency order
        default: 'fidelis fidelis-claude-code fidelis-opencode'
        required: true
permissions:
  contents: read
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-please
    # A manual dispatch skips the release-please job, which would otherwise skip this one too.
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check that every package carries the released version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node -e '
            for (const dir of ["core", "claude-code", "opencode"]) {
              const { name, version } = require(`./packages/${dir}/package.json`)
              if (version !== process.env.VERSION) {
                console.error(`${name} is ${version}, but the release is ${process.env.VERSION}`)
                process.exit(1)
              }
            }'
      - run: node --version && npm --version
      - run: npm ci
      - run: npm test
      - name: Publish workspaces not on npm yet
        env:
          PACKAGES: ${{ inputs.packages || 'fidelis fidelis-claude-code fidelis-opencode' }}
        run: |
          for name in $PACKAGES; do
            case "$name" in
              fidelis|fidelis-claude-code|fidelis-opencode) ;;
              *) echo "Refusing unknown package: $name"; exit 1 ;;
            esac
            version=$(npm pkg get version --workspace "$name" | sed -n 's/.*: "\(.*\)".*/\1/p;s/^"\(.*\)"$/\1/p' | head -n 1)
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm pack --dry-run --workspace "$name"
            npm publish --workspace "$name" --access public
          done
